name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Package application artifact
        run: |
          mkdir -p release
          cp -r backend release/
          mkdir -p release/frontend
          cp -r frontend/dist release/frontend/
          cat << 'EOF' > release/requirements.txt
          psycopg[binary]
          psycopg-pool
          EOF
          cd release && zip -r ../app.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Verify production health endpoint
        run: |
          sleep 15
          curl -f "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
