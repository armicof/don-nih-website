name: CI and deploy to EC2 with AWS SSM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: donnih-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Check, build, and deploy
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
      EC2_SERVICE_NAME: ${{ vars.EC2_SERVICE_NAME }}
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: donnih_ci_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck frontend and browser tests
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run test:e2e:typecheck

      - name: Smoke test MongoDB-backed API
        shell: bash
        run: |
          set -euo pipefail
          python -m backend.cli init --demo
          python -m backend.server --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/api/health -o health.json; then
              break
            fi
            sleep 1
          done
          python -c "import json; d=json.load(open('health.json')); assert d['ok'] and d['storage']=='mongodb' and d['demo_data']"
          curl --silent --fail http://127.0.0.1:8000/api/menus -o menus.json
          python -c "import json; assert len(json.load(open('menus.json'))) == 7"

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Validate deployment configuration
        if: github.ref == 'refs/heads/main'
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${EC2_APP_DIR:?Set the EC2_APP_DIR repository variable}"
          : "${EC2_SERVICE_NAME:?Set the EC2_SERVICE_NAME repository variable}"
          : "${AWS_INSTANCE_ID:?Set the AWS_INSTANCE_ID secret}"

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 through SSM
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          REMOTE_COMMAND="sudo -u ubuntu bash -lc 'set -e; cd \"${EC2_APP_DIR}\"; git fetch origin main; git checkout main; git reset --hard origin/main; python3 -m venv .venv; .venv/bin/python -m pip install -r requirements.txt; npm --prefix frontend ci; npm --prefix frontend run build; sudo systemctl restart \"${EC2_SERVICE_NAME}\"'"
          jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}' > ssm-parameters.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy ${GITHUB_SHA}" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command ID: $COMMAND_ID"

          for attempt in {1..60}; do
            INVOCATION=$(aws ssm list-command-invocations \
              --details \
              --instance-id "$AWS_INSTANCE_ID" \
              --command-id "$COMMAND_ID" \
              --output json)
            STATUS=$(jq -r '.CommandInvocations[0].Status // "Pending"' <<< "$INVOCATION")
            if [[ "$STATUS" == "Success" ]]; then
              jq -r '.CommandInvocations[0].CommandPlugins[] | .Output' <<< "$INVOCATION"
              exit 0
            fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              jq -r '.CommandInvocations[0].CommandPlugins[] | "Status: \(.Status)\nOutput: \(.Output)\nError: \(.Error)"' <<< "$INVOCATION"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for SSM command $COMMAND_ID"
          exit 1
