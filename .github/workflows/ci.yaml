name: CI — Don.Nih! (Frontend, Backend & MongoDB)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MONGODB_DB_NAME: PSOFP-db123
  MONGODB_URI: mongodb://127.0.0.1:27017

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      frontend_changed: ${{ steps.frontend.outputs.any_changed }}
      backend_changed: ${{ steps.backend.outputs.any_changed }}
      workflow_changed: ${{ steps.workflow.outputs.any_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: frontend
        uses: tj-actions/changed-files@v47
        with:
          files: |
            frontend/**

      - id: backend
        uses: tj-actions/changed-files@v47
        with:
          files: |
            backend/**
            tests/**

      - id: workflow
        uses: tj-actions/changed-files@v47
        with:
          files: |
            .github/workflows/**

  frontend-build:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.frontend_changed == 'true' ||
      needs.detect-changes.outputs.workflow_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Typecheck & Build Frontend
        run: npm --prefix frontend run build

  backend-test:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend_changed == 'true' ||
      needs.detect-changes.outputs.workflow_changed == 'true'
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymongo

      - name: Compile Python Bytecode
        run: python -m compileall -q backend tests

      - name: Initialize & Seed MongoDB (PSOFP-db123)
        run: python -m backend.cli init --demo

      - name: Run Backend Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  sonarcloud:
    needs: [frontend-build]
    if: |
      always() &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarCloud scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION_KEY }}
            -Dsonar.sources=frontend/src,backend
            -Dsonar.qualitygate.wait=false